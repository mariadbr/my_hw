services:
  backend:
    image: nobugsme/nbank:with_deletion
    ports:
      - "4111:4111"
    networks:
      - nbank-network

  selenoid:
    image: aerokube/selenoid:latest-release
    environment:
      DOCKER_API_VERSION: "1.40"
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/:/etc/selenoid/:ro
    command: ["-container-network", "nbank-network"]
    networks:
      - nbank-network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    ports:
      - "8080:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - nbank-network

networks:
  nbank-network:
    name: nbank-network
